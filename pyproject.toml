[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-sender"
version = "7.4.1"
description = "弹幕补档机 RS — Bilibili danmaku sender (https://github.com/iallemege/danmaku_RS-project)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "PyQt5>=5.15.0",
    "qrcode>=7.4.0",
]

[project.scripts]
danmaku-sender = "danmaku_rs.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
